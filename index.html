<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><meta name="theme-color" content="#102b46"><title>Evidencija radova</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f7;color:#102b46;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #d9e0e6;border-radius:14px;padding:24px;max-width:460px;box-shadow:0 8px 30px #0001}small{color:#65717c}</style></head><body><div class="box" id="status"><b>Učitavanje aplikacije…</b><br><small>PP32 / Cvetojevac–Sobovica</small></div><script>(async()=>{try{const u='https://uenmabnaknazurrtejpf.supabase.co/storage/v1/object/public/pp32-deploy/index.html?v='+Date.now();const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const html=await r.text();if(!html.toLowerCase().includes('<!doctype html'))throw new Error('Frontend fajl nije ispravan');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').innerHTML='<b>Greška pri učitavanju aplikacije</b><br><small>'+String(e.message||e)+'</small>'}})();</script></body></html>
