<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><meta name="theme-color" content="#102b46"><title>Evidencija radova</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f5f7;color:#102b46;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #d9e0e6;border-radius:14px;padding:24px;max-width:520px;box-shadow:0 8px 30px #0001}small{color:#65717c}</style></head><body><div class="box" id="status"><b>Učitavanje aplikacije…</b><br><small>PP32 / Cvetojevac–Sobovica</small></div><script>(async()=>{const show=e=>{document.body.innerHTML='<div class="box"><b>Greška pri pokretanju aplikacije</b><br><small>'+String(e&&e.message?e.message:e)+'</small></div>'};window.addEventListener('error',ev=>show(ev.error||ev.message));try{const u='https://uenmabnaknazurrtejpf.supabase.co/functions/v1/pp32-feed?v='+Date.now();const r=await fetch(u,{cache:'no-store',mode:'cors'});if(!r.ok)throw new Error('Feed HTTP '+r.status);const html=await r.text();if(!html.toLowerCase().includes('<!doctype html'))throw new Error('Frontend fajl nije ispravan');const doc=new DOMParser().parseFromString(html,'text/html');const scripts=[...doc.querySelectorAll('script')].map(s=>({src:s.src,code:s.textContent||'',type:s.type||''}));doc.querySelectorAll('script').forEach(s=>s.remove());document.head.innerHTML='';[...doc.head.children].forEach(n=>document.head.appendChild(document.importNode(n,true)));document.body.innerHTML=doc.body.innerHTML;for(const s of scripts){await new Promise((resolve,reject)=>{const el=document.createElement('script');if(s.type)el.type=s.type;if(s.src){el.src=s.src;el.onload=resolve;el.onerror=()=>reject(new Error('Ne mogu da učitam biblioteku: '+s.src));document.head.appendChild(el)}else{try{el.text=s.code;document.body.appendChild(el);resolve()}catch(e){reject(e)}}})}}catch(e){show(e)}})();</script></body></html>
