<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><meta name="theme-color" content="#102b46"><title>Evidencija radova</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#f3f5f7}#status{padding:16px;color:#102b46}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><div id="status">Učitavanje aplikacije…</div><script>(async()=>{try{const v=Date.now();const [a,b]=await Promise.all([fetch('./gz/0.txt?v='+v,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload 0 HTTP '+r.status);return r.text()}),fetch('./gz/1.txt?v='+v,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload 1 HTTP '+r.status);return r.text()})]);const bin=atob((a.trim()+b.trim()));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Browser ne podržava gzip raspakivanje');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();if(!html.toLowerCase().includes('<!doctype html'))throw new Error('Raspakovani frontend nije HTML');const f=document.createElement('iframe');f.srcdoc=html;document.body.innerHTML='';document.body.appendChild(f)}catch(e){document.getElementById('status').innerHTML='<b>Greška pri učitavanju aplikacije</b><br>'+String(e.message||e)}})();</script></body></html>
